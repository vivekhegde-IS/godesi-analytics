version: 2

models:
  - name: int_products__price_history
    description: "Every price version of every product (SCD Type 2) rebuilt from the versions kept in RAW. Grain: one row per sku_id per version. valid_to is NULL for the current version."
  - name: int_orders__unioned
    description: "Orders from ERP (offline), ECOM (D2C) and MARKETPLACE in one shape, with source_system and is_cancelled. Grain: one row per order_id."
  - name: int_order_items__unioned
    description: "Order lines from the three systems in one shape. Grain: one row per order_item_id."
  - name: int_order_items__enriched
    description: "Order lines joined to their order, product and the price version valid at order time; gross revenue, discount, net revenue, COGS and gross margin. Grain: one row per order_item_id."
  - name: int_returns__aggregated
    description: "Returns and refunds summed per order line. Grain: one row per returned order_item_id."
  - name: int_customers__first_order
    description: "First order date and channel, last order and lifetime orders per online customer (cancelled orders excluded). Grain: one row per customer_id with orders."
  - name: int_products__godesi_enriched
    description: "Product master with real Open Food Facts details (nutrition, Nutri-Score, image) for the 9 real GoDesi SKUs. Grain: one row per sku_id."
