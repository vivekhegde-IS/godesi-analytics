version: 2

# An exposure tells dbt what USES the models: here, the dashboard built in Phase 6.
# It appears in the lineage graph as the last node, so you can see which models feed it,
# and "dbt build -s +exposure:godesi_sales_dashboard" rebuilds and tests everything it needs.

exposures:
  - name: godesi_sales_dashboard
    label: GoDesi Sales & Distribution Dashboard
    type: dashboard
    maturity: high
    url: https://godesi-analytics.streamlit.app/
    description: >
      Streamlit dashboard for the GoDesi founder: revenue growth and channel mix (Q1-Q2), product and
      new-launch performance (Q3), regions (Q4), customer cohorts and retention (Q5), inventory stock-outs (Q6),
      promo uplift (Q7) and the competitive market from Open Food Facts (Q8-Q9).
      It runs inside Snowflake (Streamlit in Snowflake, live on the marts as REPORTER) and publicly on
      Streamlit Community Cloud from exported marts. A Power BI version (Import mode) uses the same models.
    depends_on:
      - ref('mart_sales_daily')
      - ref('mart_channel_performance')
      - ref('mart_product_performance')
      - ref('mart_customer_cohorts')
      - ref('mart_promo_impact')
      - ref('fct_inventory_daily')
      - ref('fct_orders')
      - ref('mart_market_landscape')
      - ref('mart_category_growth')
      - ref('dim_date')
      - ref('dim_products')
      - ref('dim_geography')
    owner:
      name: Vivek Hegde
