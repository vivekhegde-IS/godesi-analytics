version: 2
models:
- name: mart_sales_daily
  description: 'Q1, Q4: orders, units, gross/net revenue, discount, COGS, margin and refunds per day, channel, platform and
    city (with region and festival flags). Cancelled orders excluded. Grain: one row per order_date, platform and city.'
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - order_date
        - platform
        - city
- name: mart_product_performance
  description: 'Q2: orders, units, net revenue, COGS, gross margin and returns per SKU per month. Grain: one row per order_month
    and sku_id.'
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - order_month
        - sku_id
- name: mart_channel_performance
  description: 'Q3: revenue share, AOV, discount %, gross margin % and return rate per channel per month. Grain: one row per
    order_month and channel.'
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - order_month
        - channel
