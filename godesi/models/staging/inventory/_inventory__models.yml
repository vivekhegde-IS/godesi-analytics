version: 2
models:
- name: stg_inventory__inventory_daily
  description: 'End-of-day stock on hand. Grain: one row per snapshot_date, warehouse_id and sku_id.'
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - snapshot_date
        - warehouse_id
        - sku_id
  columns:
  - name: warehouse_id
    description: Warehouse.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - WH-BLR
          - WH-HYD
          - WH-DEL
