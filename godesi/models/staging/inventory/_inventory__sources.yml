# Freshness: dbt source freshness warns if the newest _loaded_at is older than 24 hours
# and errors after 72 hours (the feeds are expected every day).
version: 2
sources:
- name: inventory
  description: Warehouse stock system (synthetic).
  database: GODESI_RAW
  schema: INVENTORY
  config:
    loaded_at_field: _loaded_at
    freshness:
      warn_after:
        count: 24
        period: hour
      error_after:
        count: 72
        period: hour
  tables:
  - name: inventory_daily
    description: End-of-day stock per warehouse (WH-BLR, WH-HYD, WH-DEL) and SKU.
