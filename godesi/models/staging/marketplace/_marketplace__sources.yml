# Freshness: dbt source freshness warns if the newest _loaded_at is older than 24 hours
# and errors after 72 hours (the feeds are expected every day).
version: 2
sources:
- name: marketplace
  description: Marketplace (Amazon, Flipkart) and quick-commerce (Blinkit, Zepto, Instamart) feeds (synthetic).
  database: GODESI_RAW
  schema: MARKETPLACE
  config:
    loaded_at_field: _loaded_at
    freshness:
      warn_after:
        count: 24
        period: hour
      error_after:
        count: 72
        period: hour
  tables:
  - name: orders
    description: Marketplace and quick-commerce orders. Quick-commerce timestamps use DD/MM/YYYY HH:MM; some rows are exact
      duplicates.
  - name: order_items
    description: Line items. Some prices arrive as text, e.g. 'Rs. 120.00'.
